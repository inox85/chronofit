<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.25, maximum-scale=5.0">
  <title>Chronofit</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/png" href="/favicon.png">

  <!-- COLORE DELLA STATUS BAR SU ANDROID -->
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/manifest.json">
  <script src="/i18n.js"></script>

  <!-- Questa pagina non ha la navbar della GUI operatore (che riserva 60px
       in cima e per cui .container/.card.table-card hanno vincoli di
       larghezza/altezza pensati per condividere lo spazio con una sidebar):
       qui la card deve riempire l'intero schermo. -->
  <style>
    #view_container {
      height: 100vh;
    }
    #view_container .card.table-card {
      max-width: none;
      max-height: none;
      min-height: 0;
      min-width: 0;
      height: 100%;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div id="splash">
    <div class="splash-logos">
      <img src="/logo.webp" alt="Logo">
      <div class="splash-divider"></div>
      <img src="/sponsor.png" alt="Sponsor" class="sponsor-visibility-toggle">
    </div>
    <p class="splash-label" data-i18n="splash.loading">Loading session...</p>
  </div>

  <script>
    // Applica subito (sincrono) l'ultimo stato sponsor noto in cache, prima
    // che il browser disegni lo splash: evita il lampeggio sponsor/separatore
    // mentre si attende la risposta (per forza asincrona) di /brandingSettings.
    (function() {
      try {
        var c = JSON.parse(localStorage.getItem('chronofit_branding_cache') || 'null');
        if (c && !(c.showSponsorLogo && c.sponsorLogoExists)) {
          document.querySelectorAll('.sponsor-visibility-toggle, .splash-divider').forEach(function(el) {
            el.style.display = 'none';
          });
        }
      } catch (e) {}
    })();
  </script>

  <div id="popup" class="popup hidden">No connection to Chronofit device</div>

  <div id="view_container" class="container">

    <div class="card table-card">

      <div class="time-header">
        <img src="/logo-black.png" alt="Logo" class="sponsor-logo">
        <p id="time" style="font-size: 65px;">00:00:00.000</p>
        <img src="/sponsor.png" alt="Sponsor" class="sponsor-img sponsor-visibility-toggle">
      </div>

      <div class="card-title" data-i18n="card.results">Results</div>

      <div class="table-wrapper">
        <table id="results-table" class="arrivals-table">
          <thead>
            <tr>
              <th>🏅</th>
              <th data-i18n="th.competitor">Comp.</th>
              <th data-i18n="th.name">Name</th>
              <th data-i18n="th.surname">Surname</th>
              <th data-i18n="th.race_time">Race time</th>
              <th>Δ ⏱️</th>
              <th>❌</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

    </div>

  </div>

  <!-- Tabella dati grezzi, mai mostrata: memorizza i checkpoint ricevuti via
       WebSocket/sessione salvata, usata solo per calcolare i tempi di gara. -->
  <table id="event-table" style="display:none"><tbody></tbody></table>

  <!-- Settings popup della classifica: linea di partenza/arrivo usate per il
       calcolo del tempo di gara + ordinamento + precisione. A differenza di
       Enduro qui c'è una sola coppia partenza/arrivo (disciplina a singola
       prova cronometrata), quindi niente tab: tutto in un unico popup. -->
  <div id="resultsSettingsOverlay" class="fullscreen-overlay" style="display:none;">
    <div class="fullscreen-popup">

      <div class="input-row">
        <label for="res-line-start" data-i18n="net.start_line" style="font-size:20px;">Start line</label>
        <select id="res-line-start" onchange="onResultsLinesChange()">
          <option value="1" selected>L1</option>
          <option value="2">L2</option>
          <option value="3">L3</option>
          <option value="4">L4</option>
          <option value="5">L5</option>
          <option value="6">L6</option>
        </select>
      </div>
      <div class="input-row">
        <label for="res-line-finish" data-i18n="net.finish_line" style="font-size:20px;">Finish line</label>
        <select id="res-line-finish" onchange="onResultsLinesChange()">
          <option value="1">L1</option>
          <option value="2" selected>L2</option>
          <option value="3">L3</option>
          <option value="4">L4</option>
          <option value="5">L5</option>
          <option value="6">L6</option>
        </select>
      </div>

      <hr class="divider">

      <div class="input-row">
        <label for="res-sort-col" data-i18n="table.order_by" style="font-size:20px;">Order by</label>
        <select id="res-sort-col" onchange="onResultsSortChange()">
          <option value="race-time" data-i18n="th.race_time" selected>Race time</option>
          <option value="delta">Δ</option>
          <option value="competitor" data-i18n="th.competitor">Comp.</option>
          <option value="start" data-i18n="net.start_col">Start</option>
          <option value="finish" data-i18n="net.finish_col">Finish</option>
        </select>
      </div>
      <div class="input-row">
        <label for="res-time-precision" data-i18n="table.time_precision" style="font-size:20px;">Time precision decimals</label>
        <select id="res-time-precision" onchange="onResultsPrecisionChange(this.value)">
          <option value="1">1</option>
          <option value="2" selected>2</option>
          <option value="3">3</option>
        </select>
      </div>

      <div class="button-row">
        <button class="big-button" data-i18n="btn.close" id="closeResultsSettings">Close</button>
      </div>

    </div>
  </div>

  <script src="/script_view_equitazione.js"></script>

</body>
</html>
