# Configurazione di esptool (letta automaticamente da esptool >= 4.x se si trova
# nella cartella da cui viene lanciato: i .bat di programmazione fanno "cd" qui).
# Per usarla anche con il pulsante "Carica" dell'Arduino IDE copiala in
#   %LOCALAPPDATA%\esptool\esptool.cfg
# Nel log deve comparire "Loaded custom configuration from ...".
#
# ── Circuito automatico a due transistor ─────────────────────────────────────
#   DTR=1 e RTS=0 → IO0 basso (boot)        DTR=0 e RTS=1 → EN basso (reset)
#   DTR=RTS (0,0 o 1,1) → nessuna delle due: EN rilasciato, IO0 alto
# Per entrare in programmazione EN deve risalire quando IO0 è GIÀ basso.
#
# ── Sequenza di reset personalizzata ────────────────────────────────────────
# Comandi separati da "|":  R1/R0 = RTS,  D1/D0 = DTR,  Wx = attesa di x secondi
# (U = DTR e RTS insieme, solo Linux/Mac). Sostituisce la sequenza standard e
# rende inutile reset_delay.
#
#   R1|D0       reset: EN basso, IO0 alto. RTS prima di DTR: con i driver Windows
#               che trasmettono RTS solo alla scrittura di DTR, partono insieme.
#   W0.2        tiene la scheda in reset 200 ms
#   R0|D1       IO0 basso e EN rilasciato. Stesso ordine: con quei driver le due
#               linee cambiano nella stessa richiesta USB, senza lo stato
#               intermedio (EN su, IO0 ancora alto) che fa partire il firmware.
#   W0.5        IO0 resta basso 500 ms mentre EN risale (anche con un
#               condensatore grande su EN)
#   D0          rilascia IO0: il chip è nel bootloader
#
# Se con questa sequenza non si aggancia, prova le alternative (una per volta,
# togliendo il # all'inizio):
#   - ordine opposto, per adattatori che applicano subito ogni linea:
#       custom_reset_sequence = D0|R1|W0.2|D1|R0|W0.5|D0
#   - reset più lungo e IO0 basso più a lungo (EN molto lento):
#       custom_reset_sequence = R1|D0|W0.5|R0|D1|W1.0|D0
#   - sequenza standard di esptool con IO0 basso più a lungo:
#       commenta custom_reset_sequence e usa solo reset_delay = 0.5

[esptool]
custom_reset_sequence = R1|D0|W0.2|R0|D1|W0.5|D0
reset_delay = 0.5
connect_attempts = 10
