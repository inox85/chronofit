<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chronofit — Sponsor</title>
  <style>
    :root { --primary: #800020; }

    @font-face {
      font-family: 'Nunito';
      src: url('/Nunito-Bold.woff2') format('woff2');
      font-weight: bold;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      font-weight: bold;
      background: #f0f0f0;
      margin: 0; padding: 0;
    }

    /* ── navbar ── */
    .navbar {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 56px;
      background: #111;
      display: flex; align-items: center;
      padding: 0 20px; gap: 12px;
      z-index: 1000;
    }
    .navbar-title { color: #fff; font-size: 18px; letter-spacing: 1px; }

    /* ── page ── */
    .page {
      max-width: 560px;
      margin: 0 auto;
      padding: 76px 16px 40px;
    }

    .section-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #888;
      margin: 24px 0 12px;
    }

    /* ── card ── */
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }

    /* ── preview attuale ── */
    .preview-wrap {
      text-align: center;
      padding: 16px;
      background: repeating-conic-gradient(#e0e0e0 0% 25%, #f5f5f5 0% 50%)
                  0 0 / 16px 16px;
      border-radius: 8px;
      margin-bottom: 6px;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview-wrap img {
      max-width: 100%;
      max-height: 160px;
      border-radius: 4px;
    }
    .preview-none {
      font-size: 13px;
      color: #aaa;
    }

    /* ── drop zone ── */
    .drop-zone {
      border: 2px dashed #ccc;
      border-radius: 10px;
      padding: 28px 16px;
      text-align: center;
      color: #999;
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: #fff;
    }
    .drop-zone.drag-over {
      border-color: var(--primary);
      background: #fff5f6;
      color: var(--primary);
    }
    .drop-zone.has-file {
      border-color: #2e7d32;
      background: #f0f8f0;
      color: #2e7d32;
    }
    .drop-zone .dz-icon { font-size: 32px; display: block; margin-bottom: 8px; }
    .drop-zone input[type=file] { display: none; }

    /* ── progress ── */
    .progress-wrap { display: none; margin-top: 14px; }
    .progress-wrap.visible { display: block; }
    .prog-label { font-size: 13px; color: #444; margin-bottom: 6px; }
    .prog-track { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; }
    .prog-fill  { height: 100%; background: var(--primary); border-radius: 4px; width: 0%; transition: width 0.2s; }
    .prog-status { font-size: 12px; color: #888; margin-top: 4px; }

    /* ── upload button ── */
    .btn-upload {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Nunito', sans-serif;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-upload:hover { opacity: 0.85; }
    .btn-upload:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── error badge ── */
    .error-msg {
      font-size: 13px;
      color: #c62828;
      background: #fce4ec;
      border-radius: 6px;
      padding: 8px 12px;
      margin-top: 10px;
      display: none;
    }
    .error-msg.visible { display: block; }

    /* ── toast ── */
    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #222; color: #fff;
      font-size: 14px; padding: 10px 20px;
      border-radius: 8px; opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 9999;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.ok  { background: #2e7d32; }
    #toast.err { background: #c62828; }

  </style>
</head>
<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <img src="/logo.png" alt="Chronofit" style="height:32px;"
         onerror="this.style.display='none'"/>
    <span class="navbar-title">Sponsor</span>
  </div>

  <div class="page">

    <div class="section-title">Immagine attuale</div>
    <div class="card">
      <div class="preview-wrap" id="current-preview">
        <span class="preview-none">Nessuna immagine caricata</span>
      </div>
      <div style="font-size:12px; color:#aaa; text-align:center; margin-top:6px;">
        /sponsor.png
      </div>
    </div>

    <div class="section-title">Carica nuova immagine</div>
    <div class="card">
      <div class="drop-zone" id="drop-zone"
           onclick="document.getElementById('file-input').click()"
           ondragover="onDragOver(event)"
           ondragleave="onDragLeave(event)"
           ondrop="onDrop(event)">
        <input type="file" id="file-input" accept="image/png"
               onchange="onFileSelected(this.files[0])"/>
        <span class="dz-icon">🖼️</span>
        <span id="dz-label">Trascina un file <strong>PNG</strong> qui<br>oppure <strong>clicca per selezionare</strong></span>
      </div>

      <div class="error-msg" id="error-msg"></div>

      <div class="progress-wrap" id="progress-wrap">
        <div class="prog-label" id="prog-label">sponsor.png</div>
        <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
        <div class="prog-status" id="prog-status"></div>
      </div>

      <button class="btn-upload" id="btn-upload" disabled
              onclick="uploadSponsor()">
        Carica sponsor.png
      </button>
    </div>

  </div>

  <div id="toast"></div>

  <script>
    let selectedFile = null;

    /* ── carica preview attuale ── */
    function loadCurrentPreview() {
      const wrap = document.getElementById('current-preview');
      const img = new Image();
      img.onload = () => {
        wrap.innerHTML = '';
        wrap.appendChild(img);
      };
      img.onerror = () => {
        wrap.innerHTML = '<span class="preview-none">Nessuna immagine caricata</span>';
      };
      img.src = '/sponsor.png?t=' + Date.now();
      img.alt = 'sponsor';
    }
    loadCurrentPreview();

    /* ── validazione PNG ── */
    function validatePng(file) {
      if (!file) return Promise.reject('Nessun file selezionato.');
      if (file.type !== 'image/png' && !file.name.toLowerCase().endsWith('.png'))
        return Promise.reject('Il file deve essere in formato PNG.');

      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => {
          const bytes = new Uint8Array(e.target.result);
          // Magic bytes PNG: 89 50 4E 47 0D 0A 1A 0A
          const magic = [0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A];
          const ok = magic.every((b, i) => bytes[i] === b);
          ok ? resolve() : reject('Il file non è un PNG valido (magic bytes errati).');
        };
        reader.readAsArrayBuffer(file.slice(0, 8));
      });
    }

    /* ── selezione file ── */
    function onFileSelected(file) {
      if (!file) return;
      setError('');
      validatePng(file)
        .then(() => {
          selectedFile = file;
          document.getElementById('dz-label').innerHTML =
            '<strong>' + escHtml(file.name) + '</strong><br>' +
            fmtBytes(file.size) + ' — PNG ✓';
          document.getElementById('drop-zone').classList.add('has-file');
          document.getElementById('btn-upload').disabled = false;
        })
        .catch(msg => {
          selectedFile = null;
          document.getElementById('drop-zone').classList.remove('has-file');
          document.getElementById('btn-upload').disabled = true;
          document.getElementById('dz-label').innerHTML =
            'Trascina un file <strong>PNG</strong> qui<br>oppure <strong>clicca per selezionare</strong>';
          setError(msg);
        });
    }

    /* ── drag & drop ── */
    function onDragOver(e) {
      e.preventDefault();
      document.getElementById('drop-zone').classList.add('drag-over');
    }
    function onDragLeave() {
      document.getElementById('drop-zone').classList.remove('drag-over');
    }
    function onDrop(e) {
      e.preventDefault();
      document.getElementById('drop-zone').classList.remove('drag-over');
      const f = e.dataTransfer.files[0];
      if (f) onFileSelected(f);
    }

    /* ── upload ── */
    function uploadSponsor() {
      if (!selectedFile) return;

      const prog   = document.getElementById('progress-wrap');
      const fill   = document.getElementById('prog-fill');
      const status = document.getElementById('prog-status');
      const btn    = document.getElementById('btn-upload');

      prog.classList.add('visible');
      fill.style.width = '0%';
      status.textContent = 'Caricamento...';
      btn.disabled = true;

      // Rinomina sempre il file in sponsor.png
      const renamed = new File([selectedFile], 'sponsor.png', { type: 'image/png' });
      const fd = new FormData();
      fd.append('file', renamed);

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/upload');

      xhr.upload.onprogress = e => {
        if (e.lengthComputable) {
          const p = Math.round(e.loaded / e.total * 100);
          fill.style.width = p + '%';
          status.textContent = p + '% — ' + fmtBytes(e.loaded) + ' / ' + fmtBytes(e.total);
        }
      };

      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          fill.style.width = '100%';
          status.textContent = 'Completato ✓';
          showToast('sponsor.png caricato con successo', 'ok');
          setTimeout(() => {
            loadCurrentPreview();
            prog.classList.remove('visible');
            selectedFile = null;
            btn.disabled = true;
            document.getElementById('drop-zone').classList.remove('has-file');
            document.getElementById('dz-label').innerHTML =
              'Trascina un file <strong>PNG</strong> qui<br>oppure <strong>clicca per selezionare</strong>';
            document.getElementById('file-input').value = '';
          }, 1200);
        } else {
          status.textContent = 'Errore: ' + xhr.status;
          showToast('Errore upload: ' + xhr.status, 'err');
          btn.disabled = false;
        }
      };

      xhr.onerror = () => {
        status.textContent = 'Errore di rete';
        showToast('Errore di rete', 'err');
        btn.disabled = false;
      };

      xhr.send(fd);
    }

    /* ── helpers ── */
    function setError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.toggle('visible', !!msg);
    }

    function fmtBytes(b) {
      if (b >= 1048576) return (b / 1048576).toFixed(2) + ' MB';
      if (b >= 1024)    return (b / 1024).toFixed(1)    + ' KB';
      return b + ' B';
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    let toastTimer;
    function showToast(msg, type = 'ok') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'show ' + type;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.className = '', 2800);
    }
  </script>
</body>
</html>
