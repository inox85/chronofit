<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chronofit — Branding</title>
  <script src="/disciplines.js"></script>
  <style>
    :root { --primary: #800020; }

    @font-face {
      font-family: 'Nunito';
      src: url('/Nunito-Bold.woff2') format('woff2');
      font-weight: bold;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      font-weight: bold;
      background: #f0f0f0;
      margin: 0; padding: 0;
    }

    /* ── navbar ── */
    .navbar {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 56px;
      background: #111;
      display: flex; align-items: center;
      padding: 0 20px; gap: 12px;
      z-index: 1000;
    }
    .navbar-title { color: #fff; font-size: 18px; letter-spacing: 1px; }

    /* ── page ── */
    .page {
      max-width: 560px;
      margin: 0 auto;
      padding: 76px 16px 40px;
    }

    .section-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #888;
      margin: 24px 0 12px;
    }

    /* ── card ── */
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }

    .field-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .field-row:last-child { margin-bottom: 0; }
    .field-row label {
      font-size: 13px;
      color: #555;
    }
    .field-row input[type=text],
    .field-row input[type=password] {
      font-family: 'Nunito', sans-serif;
      font-weight: bold;
      font-size: 14px;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    .field-hint {
      font-size: 12px;
      color: #aaa;
      font-weight: normal;
    }

    /* ── toggle row (disciplina / logo sponsor) ── */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .toggle-row:last-child { border-bottom: none; }
    .toggle-row .label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      color: #333;
    }
    .toggle-row input[type=checkbox] {
      width: 22px; height: 22px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    /* ── preview attuale (sola lettura — l'upload resta in sponsor.html) ── */
    .preview-wrap {
      text-align: center;
      padding: 16px;
      background: repeating-conic-gradient(#e0e0e0 0% 25%, #f5f5f5 0% 50%)
                  0 0 / 16px 16px;
      border-radius: 8px;
      margin-bottom: 6px;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview-wrap img {
      max-width: 100%;
      max-height: 160px;
      border-radius: 4px;
    }
    .preview-none {
      font-size: 13px;
      color: #aaa;
    }
    .preview-link {
      display: block;
      text-align: center;
      font-size: 12px;
      color: var(--primary);
      margin-top: 6px;
      text-decoration: none;
    }
    .preview-link:hover { text-decoration: underline; }

    /* ── buttons ── */
    .btn-primary {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Nunito', sans-serif;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── error badge ── */
    .error-msg {
      font-size: 13px;
      color: #c62828;
      background: #fce4ec;
      border-radius: 6px;
      padding: 8px 12px;
      margin-top: 10px;
      display: none;
    }
    .error-msg.visible { display: block; }

    /* ── toast ── */
    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #222; color: #fff;
      font-size: 14px; padding: 10px 20px;
      border-radius: 8px; opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 9999;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.ok  { background: #2e7d32; }
    #toast.err { background: #c62828; }

  </style>
</head>
<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <img src="/logo.png" alt="Chronofit" style="height:32px;"
         onerror="this.style.display='none'"/>
    <span class="navbar-title">Branding</span>
  </div>

  <div class="page">

    <div class="section-title">Accesso</div>
    <div class="card">
      <div class="field-row">
        <label for="api-token">API Token <span class="field-hint">(richiesto solo se configurato sul dispositivo)</span></label>
        <input type="password" id="api-token" placeholder="X-Token" autocomplete="off">
      </div>
    </div>

    <div class="section-title">Discipline abilitate</div>
    <div class="card">
      <div id="discipline-toggles"></div>
    </div>

    <div class="section-title">Logo sponsor</div>
    <div class="card">
      <div class="toggle-row">
        <span class="label">Mostra sponsor.png sulle pagine</span>
        <input type="checkbox" id="sponsor-logo-enabled">
      </div>
      <div class="preview-wrap" id="current-preview" style="margin-top:14px;">
        <span class="preview-none">Nessuna immagine caricata</span>
      </div>
      <a class="preview-link" href="/sponsor.html">Carica o sostituisci sponsor.png →</a>
    </div>

    <button class="btn-primary" id="btn-save" onclick="saveBranding()">Salva impostazioni</button>
    <div class="error-msg" id="save-error"></div>

  </div>

  <div id="toast"></div>

  <script>
    const TOKEN_KEY = 'chronofit_branding_token';

    /* ── token persistito per comodità (solo in questo browser) ── */
    function getToken() {
      const el = document.getElementById('api-token');
      return el.value || '';
    }
    document.getElementById('api-token').value = localStorage.getItem(TOKEN_KEY) || '';
    document.getElementById('api-token').addEventListener('input', e => {
      localStorage.setItem(TOKEN_KEY, e.target.value);
    });

    /* ── discipline toggles ── */
    function renderDisciplineToggles(flags) {
      const box = document.getElementById('discipline-toggles');
      const list = DISCIPLINES.filter(d => STARTUP_DISCIPLINE_IDS.includes(d.id));
      box.innerHTML = list.map(d => {
        // Il device risponde con 0/1 (JSON numerico), non booleani.
        const v = flags[d.id];
        const enabled = !(v === false || v === 0 || v === '0'); // default abilitata se assente
        return `
          <div class="toggle-row">
            <span class="label">${d.emoji} ${d.label.it ?? d.label.en}</span>
            <input type="checkbox" class="disc-toggle" data-id="${d.id}" ${enabled ? 'checked' : ''}>
          </div>
        `;
      }).join('');
    }

    /* ── preview sola lettura dell'attuale sponsor.png ── */
    function loadCurrentPreview() {
      const wrap = document.getElementById('current-preview');
      const img = new Image();
      img.onload = () => {
        wrap.innerHTML = '';
        wrap.appendChild(img);
      };
      img.onerror = () => {
        wrap.innerHTML = '<span class="preview-none">Nessuna immagine caricata</span>';
      };
      img.src = '/sponsor.png?t=' + Date.now();
      img.alt = 'sponsor';
    }

    /* ── carica stato attuale ── */
    async function loadBrandingSettings() {
      try {
        const res = await fetch('/brandingSettings');
        const data = await res.json();
        renderDisciplineToggles(data.disciplines || {});
        document.getElementById('sponsor-logo-enabled').checked = !!data.showSponsorLogo;
      } catch (e) {
        renderDisciplineToggles({});
        showToast('Impossibile leggere le impostazioni dal dispositivo', 'err');
      }
      loadCurrentPreview();
    }
    loadBrandingSettings();

    /* ── salvataggio ── */
    async function saveBranding() {
      setSaveError('');
      const btn = document.getElementById('btn-save');
      btn.disabled = true;

      const flags = {};
      document.querySelectorAll('.disc-toggle').forEach(chk => {
        flags[chk.dataset.id] = chk.checked ? 1 : 0;
      });
      const showSponsorLogo = document.getElementById('sponsor-logo-enabled').checked ? 1 : 0;

      const params = new URLSearchParams({
        disciplines: JSON.stringify(flags),
        showSponsorLogo: String(showSponsorLogo)
      });

      try {
        const res = await fetch('/brandingSave?' + params.toString(), {
          headers: getToken() ? { 'X-Token': getToken() } : {}
        });
        if (res.ok) {
          showToast('Impostazioni salvate', 'ok');
        } else if (res.status === 401) {
          setSaveError('Token non valido o mancante.');
          showToast('Non autorizzato (401)', 'err');
        } else {
          setSaveError('Errore: ' + res.status);
          showToast('Errore salvataggio: ' + res.status, 'err');
        }
      } catch (e) {
        setSaveError('Errore di rete.');
        showToast('Errore di rete', 'err');
      } finally {
        btn.disabled = false;
      }
    }

    /* ── helpers ── */
    function setSaveError(msg) {
      const el = document.getElementById('save-error');
      el.textContent = msg;
      el.classList.toggle('visible', !!msg);
    }

    let toastTimer;
    function showToast(msg, type = 'ok') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'show ' + type;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.className = '', 2800);
    }
  </script>
</body>
</html>
